[project]
name = "leadpipe"
version = "0.1.0"
description = "Configurable lead collection, normalization, validation and deduplication service"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "phonenumbers>=8.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "apscheduler>=3.10,<4",
    "httpx>=0.28.1",
]

[project.scripts]
leadpipe = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.15.0",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    
    "F",    
    "I",    
    "UP",   
    "B",    
    "SIM",  
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integration: requires a database or other external service",
]
