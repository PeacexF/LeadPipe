defaults:
  region: FI

sources:
  - name: example_api
    type: api
    enabled: true
    # higher than the csv source, so it wins when the two disagree
    priority: 10

    url: ${FIXTURES_URL:-http://localhost:8080}/companies_api.json
    items_path: data
    next_path: meta.next
    max_pages: 5
    external_id_field: id

    # the fixture server is not on the public internet
    allow_private_hosts: true
    requests_per_second: 10
    timeout: 5.0
    max_response_bytes: 1000000

    mapping:
      company_name: name
      contact_name: contact.name
      email: contact.email
      phone: contact.phone
      website: website
      address: address.street
      city: address.city
      country: address.country
