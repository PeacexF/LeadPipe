defaults:
  region: FI

sources:
  - name: example_csv
    type: csv
    enabled: true
    priority: 0
    path: ./examples/data/companies.csv
    external_id_field: id

    schedule:
      enabled: false
      cron: "0 9 * * *"
      timezone: Europe/Helsinki

    mapping:
      company_name: name
      contact_name: contact
      website: website
      email: email
      phone: phone
      address: street
      city: city
      country: country
