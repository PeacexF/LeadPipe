x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leadpipe}:${POSTGRES_PASSWORD:-leadpipe}@postgres:5432/${POSTGRES_DB:-leadpipe}
    CONFIG_PATH: ${CONFIG_PATH:-examples/configs/all.yaml}
    FIXTURES_URL: http://fixtures
    LEADPIPE_API_KEY: ${LEADPIPE_API_KEY:-}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-json}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadpipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadpipe}
      POSTGRES_DB: ${POSTGRES_DB:-leadpipe}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadpipe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api and worker never race to migrate
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leadpipe}:${POSTGRES_PASSWORD:-leadpipe}@postgres:5432/${POSTGRES_DB:-leadpipe}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["leadpipe", "serve"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["leadpipe", "worker"]
    stop_grace_period: 30s

  fixtures:
    image: nginx:alpine
    volumes:
      - ./examples/data:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${FIXTURES_PORT:-8080}:80"

volumes:
  postgres_data:
