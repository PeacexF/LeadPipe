services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadpipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadpipe}
      POSTGRES_DB: ${POSTGRES_DB:-leadpipe}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadpipe}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
